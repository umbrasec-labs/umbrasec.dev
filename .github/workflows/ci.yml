# Build check and tests on every pull request and on master. Commits from
# Claude Code cloud sessions skip .githooks/pre-commit, so this is where they
# get the same checks. The hero reel part of --check needs ../detections next
# to this repo; without it the check prints a note and skips that part only.
name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Derived files in sync
        run: python3 tools/site-build/build_indexes.py --check
      - name: Site-build tests
        run: python3 -m unittest discover -s tools/site-build -p 'test_*.py'
      - name: Function tests
        run: npm test
      - name: Install pinned build tools
        run: npm ci --ignore-scripts
      - name: Tailwind CSS in sync
        run: npm run check:css
