<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f25623"/>
      <stop offset="1" stop-color="#f56e0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="30%" r="60%">
      <stop offset="0" stop-color="#f25623" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#f56e0f" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#171717" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f25623" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#171717"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint trace-to-rule motif: technique -> event -> rule
       (tools/sigma-pack/rules/windows/kerberoasting-rc4-service-ticket.yml and its Claims Ledger events) -->
  <g opacity="0.7" transform="translate(-22 0)">
    <path d="M840 124 H966 M990 124 H1094" fill="none" stroke="#f25623" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="830" cy="124" r="8" fill="#171717" stroke="#f25623" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="978" cy="124" r="8" fill="#171717" stroke="#f25623" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="1098" y="114" width="20" height="20" rx="4" fill="#f25623" fill-opacity="0.6"/>
    <g font-family="monospace" font-size="15" text-anchor="middle">
      <text x="830" y="96" fill="#7d837d">technique</text>
      <text x="978" y="96" fill="#7d837d">event</text>
      <text x="1108" y="96" fill="#7d837d">rule</text>
      <text x="830" y="164" fill="#aeab94">T1558.003</text>
      <text x="978" y="164" fill="#aeab94">4769 0x17</text>
      <text x="1108" y="164" fill="#f56e0f">match</text>
    </g>
  </g>

  <!-- brand lockup -->
  <g transform="translate(90, 96)">
    <rect width="56" height="56" rx="12" fill="url(#badge)"/>
    <text x="28" y="41" font-size="36" font-weight="bold" fill="#171717" text-anchor="middle">U</text>
    <text x="78" y="40" font-size="38" font-weight="bold" fill="#ccd0cf" letter-spacing="-1">UMBRASEC</text>
    <text x="345" y="38" font-size="18" fill="#959c95" font-family="monospace">2026</text>
  </g>

  <!-- headline -->
  <text x="88" y="320" font-size="80" font-weight="bold" fill="#ccd0cf" letter-spacing="-3">Trace the technique.</text>
  <text x="88" y="411" font-size="80" font-weight="bold" fill="#f25623" letter-spacing="-3">Forge the rule.</text>

  <!-- subtitle -->
  <text x="90" y="486" font-size="27" fill="#959c95">Independent defensive security research - detection engineering,</text>
  <text x="90" y="524" font-size="27" fill="#959c95">threat analysis, and open-source tooling.</text>

  <!-- footer line -->
  <rect x="90" y="566" width="34" height="3" rx="1.5" fill="#f25623"/>
  <text x="138" y="575" font-size="22" fill="#f56e0f" font-family="monospace">umbrasec.dev</text>
</svg>
