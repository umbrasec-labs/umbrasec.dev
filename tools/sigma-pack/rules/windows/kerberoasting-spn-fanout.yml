title: Kerberoasting - High Volume of Distinct SPN Requests
id: 1c9d4b77-2e55-4f01-bb3a-6d8e9f0a1b22
status: experimental
description: >
    A single account requested Kerberos service tickets (4769) for an
    unusually large number of distinct service principals in a short
    window - consistent with bulk Kerberoasting enumeration.
references:
    - https://attack.mitre.org/techniques/T1558/003/
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769
    - https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack
    - https://umbrasec.dev/research/detecting-kerberoasting.html
author: UMBRASEC
date: 2026-06-10
modified: 2026-10-29
tags:
    - attack.credential-access
    - attack.t1558.003
correlation:
    type: value_count
    rules:
        - kerberoasting_4769_base
    group-by:
        - TargetUserName
    timespan: 5m
    condition:
        gte: 15
        field: ServiceName
falsepositives:
    - Vulnerability scanners and monitoring accounts that request tickets for many services in a burst - allowlist them
    - Busy legitimate accounts above the default threshold - run it report-only first and set gte above your noisiest legitimate account
level: medium
---
title: Kerberoasting 4769 base
id: 2d0e5c88-3f66-4012-cc4b-7e9f0a1b2c33
name: kerberoasting_4769_base
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4769
        Status: '0x0'
    # Requests from computer accounts. Windows writes the requester as
    # name@REALM, so a computer account shows as HOST$@REALM (Microsoft's
    # event 4769 reference, and the public EVTX-to-MITRE-Attack samples);
    # the bare $ ending is kept for sensors that strip the realm.
    filter_machine:
        - TargetUserName|endswith: '$'
        - TargetUserName|contains: '$@'
    # Tickets for computer accounts and krbtgt, the same filters as the RC4
    # rule: a burst of host tickets (BloodHound host enumeration in the
    # EVTX-to-MITRE-Attack samples) is not Kerberoasting of service accounts.
    filter_machine_service:
        ServiceName|endswith: '$'
    filter_krbtgt:
        ServiceName: 'krbtgt'
    condition: selection and not 1 of filter_*
